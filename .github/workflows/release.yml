name: Build and publish release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'tools/**'
      - 'vendor/**'
      - 'licenses/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified runtime binaries
        shell: pwsh
        run: |
          Copy-Item vendor/runtime/* app/
          $manifest = Get-Content core/binary-manifest.json | ConvertFrom-Json
          foreach ($item in $manifest.PSObject.Properties) {
            if ((Get-FileHash (Join-Path app $item.Name) -Algorithm SHA256).Hash.ToLower() -ne $item.Value) {
              throw "Runtime checksum mismatch: $($item.Name)"
            }
          }
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows package
        run: python tools/build.py
      - name: Package complete corresponding source
        run: python tools/package_sources.py
      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File -Filter '*.zip'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish v0.1.0 if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'v0.1.0 already exists; keeping the published assets.'
            exit 0
          }
          gh release create v0.1.0 `
            dist/JMU-campus-auth-windows-x64-v0.1.0.zip `
            dist/JMU-campus-auth-complete-source-v0.1.0.zip `
            dist/SHA256SUMS.txt `
            --target $env:GITHUB_SHA --title '校园网助手 v0.1.0' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
